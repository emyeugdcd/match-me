name: Match-Me CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Verify Dependencies (go mod verify)
        run: go mod verify

      - name: Run Go Vet & Static Analysis
        run: go vet ./...

      - name: Run Unit Tests with Race Detection (go test -v -race ./...)
        run: go test -v -race ./...

      - name: Test Build Binary (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -v -o /dev/null ./src/main.go

  frontend-test:
    name: Frontend CI (TypeScript & React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies (npm ci)
        run: npm ci

      - name: Enforce Zero-Warning ESLint Quality Gate (npm run lint)
        run: npm run lint

      - name: TypeScript Type-Check & Production Build (tsc -b && vite build)
        run: npm run build

  docker-compose-validate:
    name: Container & Compose Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Compose Config, Healthchecks & Service Dependencies
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Server Image (Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: match-me-server:ci-test

      - name: Build Multi-Stage Client Image (Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: match-me-client:ci-test
