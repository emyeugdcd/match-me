services:
  # PostgreSQL Database
  db:
    image: postgres:18
    container_name: match-me-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - match-me-network

  # Go Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: match-me-server
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: admin
      DB_NAME: mydatabase
      DB_PASSWORD: admin123
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production-make-it-long-and-random}
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - match-me-network
    restart: unless-stopped

  # React Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: match-me-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - server
    networks:
      - match-me-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  match-me-network:
    driver: bridge
